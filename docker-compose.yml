services:
  hasdr-engine:
    build:
      context: ./bridge
    container_name: hasdr-engine
    restart: unless-stopped
    ports:
      - "${HASDR_BIND:-0.0.0.0}:8099:8099"
    environment:
      HASDR_API_TOKEN: "${HASDR_API_TOKEN:?Set HASDR_API_TOKEN in .env}"
      HASDR_NAME: "${HASDR_NAME:-HASDR SDR Engine}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
