name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest pytest-asyncio ruff aiohttp pyyaml
      - run: ruff check bridge custom_components/rtl_sdr hasdr_engine/sdr_bridge tests
      - run: pytest -q
      - run: python -m compileall -q custom_components bridge hasdr_engine/sdr_bridge
      - name: Validate JSON and YAML metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          for path in [
              Path("hacs.json"),
              Path("custom_components/rtl_sdr/manifest.json"),
              Path("custom_components/rtl_sdr/strings.json"),
              Path("custom_components/rtl_sdr/translations/en.json"),
          ]:
              json.loads(path.read_text())

          for path in [
              Path("repository.yaml"),
              Path("hasdr_engine/config.yaml"),
              Path("hasdr_engine/translations/en.yaml"),
          ]:
              yaml.safe_load(path.read_text())
          PY

  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "homeassistant==2026.9.2"
      - name: Import HASDR against Home Assistant
        run: |
          python - <<'PY'
          import importlib

          modules = [
              "custom_components.rtl_sdr",
              "custom_components.rtl_sdr.api",
              "custom_components.rtl_sdr.binary_sensor",
              "custom_components.rtl_sdr.button",
              "custom_components.rtl_sdr.config_flow",
              "custom_components.rtl_sdr.coordinator",
              "custom_components.rtl_sdr.diagnostics",
              "custom_components.rtl_sdr.local",
              "custom_components.rtl_sdr.number",
              "custom_components.rtl_sdr.sensor",
              "custom_components.rtl_sdr.system_health",
          ]
          for module in modules:
              importlib.import_module(module)
          print("HASDR Home Assistant imports passed")
          PY

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - context: ./bridge
            tag: hasdr-remote:test
          - context: ./hasdr_engine
            tag: hasdr-engine-app:test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          push: false
          tags: ${{ matrix.target.tag }}
